name: Bug report
description: Report a reproducible bug
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Please include the operation's error `code` and `suggestions` if available —
        node-vfs errors are stable contract strings that help us locate the root cause.

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full `ErrResult` if possible.
      placeholder: |
        code: FILE_TOO_LARGE
        error: ...
        suggestions: [...]
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal runnable code that triggers the bug. Prefer a memory backend snippet.
      placeholder: |
        import { createVFS, InMemoryBackend } from '@loopflux/node-vfs'
        ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Node version, OS, and package versions.
      placeholder: |
        Node: 22.x
        OS: Windows 11 / macOS / Ubuntu
        @loopflux/node-vfs: 0.0.1
        @loopflux/node-vfs-toolkit: 0.0.1
    validations:
      required: false

  - type: dropdown
    id: virtual-mode
    attributes:
      label: Sandbox mode
      description: Which backend/path mode are you using?
      options:
        - FilesystemBackend (virtualMode: true)
        - FilesystemBackend (virtualMode: false)
        - InMemoryBackend
        - Not sure
    validations:
      required: false
